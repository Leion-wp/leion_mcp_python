[project]
name = "leion_mcp"
version = "0.1.0"

dependencies = [
    "fastmcp>=2.13.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Phase D.0.2: Backend event streaming via Redis PubSub
streaming = [
    "redis[hiredis]>=7.1.0",
    "structlog>=25.0.0"
]

[tool.setuptools]
packages = ["leion_engine","tools", "utils", "servers", "services"]
