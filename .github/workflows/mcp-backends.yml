name: MCP backends

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared dependencies
        run: python -m pip install -e .
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile backend sources
        run: python -m compileall -q servers tools tests
      - name: Verify local backends and MCP contracts
        run: python -m unittest discover -s tests -v
